<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inference @ UBC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  <link rel="icon" type="image/png" href="./favicon.ico">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <button id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 20 20" fill="none" width="20" height="20">
            <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
        </button>
        <a href="#" class="logo" id="home-link">Inference @ UBC</a>
      </div>
      <div class="header-right">
        <button id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" width="20" height="20">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <nav id="sidebar">
        <div class="sidebar-content" id="nav-list"></div>
      </nav>

      <main id="content">
        <article id="article" class="prose"></article>
        <nav id="page-nav" class="page-nav"></nav>
      </main>

      <aside id="toc" class="toc-sidebar">
        <h4>On this page</h4>
        <ul id="toc-list"></ul>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
